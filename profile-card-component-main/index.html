<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  
  <title>Frontend Mentor | Profile card component</title>
  <link rel="stylesheet" href="./css/main.css">
</head>
<body>

  <main>
    <img src="./images/bg-pattern-card.svg" alt="">
    <img src="./images/image-victor.jpg" alt="">
    <h1>Victor Crest <span>26</span></h1>
    <p>London</p>
    <hr>
    <div class="stats">
      <div>
        <p class="top-stat">80K</p>
        <p class="bottom-stat">Followers</p>
      </div>
      <div>
        <p class="top-stat">803K</p>
        <p class="bottom-stat">Likes</p>
      </div>
      <div>
        <p class="top-stat">1.4K</p>
        <p class="bottom-stat">Photos</p>
      </div>
    </div>
  </main>
  
  <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>. 
    Coded by <a href="https://github.com/xClaudiaArias">Claudia</a>.
  </footer>
</body>
</html>
